# Neo4j 5.26 (versión LTS) + librería Graph Data Science (GDS) para PageRank y Louvain.
#   Levantar:   docker compose up -d
#   Browser:    http://localhost:7474   (usuario: neo4j / contraseña: la de .env)
#   Bolt:       bolt://localhost:7687   (puerto que usa el driver del backend)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: red-profesional-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (interfaz web)
      - "7687:7687"   # Protocolo Bolt (drivers y cypher-shell)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-redprofesional123}
      # Ojo: toda variable que empiece por NEO4J_ se convierte en configuración de Neo4j,
      # por eso la contraseña del healthcheck va en una variable con otro nombre.
      DB_PASSWORD: ${NEO4J_PASSWORD:-redprofesional123}
      # El contenedor descarga e instala el plugin GDS compatible al arrancar
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data          # los datos sobreviven a reinicios del contenedor
      - ./db:/scripts:ro          # los .cypher quedan disponibles dentro del contenedor
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${DB_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ---------- Benchmark grafo vs relacional ----------
  # Solo arrancan con: docker compose --profile benchmark up -d
  # Bases aparte: la demo no se toca, y Neo4j Community admite una sola base de usuario.
  # Mismos recursos para las dos: 4 CPU, 5 GB de RAM y 2 GB de caché cada una.
  neo4j-bench:
    image: neo4j:5.26-community
    container_name: red-profesional-neo4j-bench
    profiles: ["benchmark"]
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/benchmark123
      DB_PASSWORD: benchmark123
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    volumes:
      - neo4j_bench_data:/data
      # LOAD CSV lee de aquí. En /import y no en /var/lib/neo4j/import: esa otra la toma como
      # propia, le cambia dueño y permisos, y Postgres ya no puede leer la misma carpeta.
      - ./benchmark/datos:/import:ro
    cpus: 4
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${DB_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres-bench:
    image: postgres:17
    container_name: red-profesional-postgres-bench
    profiles: ["benchmark"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: benchmark123
      POSTGRES_DB: red
    # shared_buffers es la caché de Postgres, el equivalente del pagecache de Neo4j.
    command: >
      postgres -c shared_buffers=2GB -c effective_cache_size=4GB
      -c work_mem=64MB -c maintenance_work_mem=512MB
    volumes:
      - postgres_bench_data:/var/lib/postgresql/data
      - ./benchmark/datos:/datos:ro                 # COPY lee de aquí
    cpus: 4
    mem_limit: 5g
    shm_size: 1g   # las consultas en paralelo de Postgres usan /dev/shm; 64 MB no alcanzan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d red"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_bench_data:
  postgres_bench_data:
